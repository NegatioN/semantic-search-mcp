[project]
name = "gemma-embedder"
version = "0.0.1"
description = "Local semantic code search with EmbeddingGemma 2 via llama.cpp, exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pathspec>=0.12",
    "watchdog>=4",
    "mcp>=1.9",
]

[project.optional-dependencies]
symbols = ["tree-sitter", "tree-sitter-language-pack"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
gemma-embedder = "gemma_embedder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_embedder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
